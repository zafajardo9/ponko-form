services:
  - type: web
    name: ponkoform
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: VITE_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: VITE_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: VITE_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /
      - key: VITE_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /
