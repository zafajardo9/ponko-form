services:
  - type: web
    name: ponkoform
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
